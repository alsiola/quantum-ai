[project]
name = "qmem"
version = "0.1.0"
description = "Measurement-induced memory: a differentiable density-matrix simulator of quantum instruments for autoregressive sequence models"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF002", "RUF003", "E741"]
