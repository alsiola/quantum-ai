# Phase 8 Stage 4 (issue #36): the combined pre-registration of the three hardware tiers and its
# LOCAL dry-run harness; Stage 5 (#37): the live path (experiments/phase8_live.py), one tier at a
# time, under the owner's standing Open-plan approval on #28 (CLAUDE.md exception).
#
#   uv run python experiments/phase8_hw.py --config experiments/configs/phase8_hw.toml --dry-run-local
#   uv run --group hardware python experiments/phase8_hw.py --config experiments/configs/phase8_hw.toml --dry-run --tier tier1
#   uv run --group hardware python experiments/phase8_hw.py --config experiments/configs/phase8_hw.toml --submit --tier tier1
#
# Every rule below is fixed before any data (docs/phase8-preregistration.md). The stage designs
# are read from their own configs and summaries, never restated here.

[experiment]
name = "phase8_hw"
summary_dir = "results/summaries/phase8_prereg"
workers = 2                                     # at most 2 on the shared machine
device = "results/summaries/phase7_spectator/device.json"   # FakeKingston, 2026-04-15 (stale)
reference_config = "experiments/configs/phase8_reference.toml"     # Tier 1 (#33)
coherence_config = "experiments/configs/phase8_coherence.toml"     # Tier 2 (#32, #34)
replication_config = "experiments/configs/phase8_replication.toml" # Tier 3 (#31)
prereg = "docs/phase8-preregistration.md"

[order]
tiers = ["tier1", "tier2", "tier3"]             # #28's ranking; each runs only on its own approval
deferrable = ["tier3"]

[approval]
# One issue-comment URL per tier, written by the owner's approval on #28 and never edited after a
# run has used it (qmem.prereg.freeze_approval). Empty: not approved. This harness never reads
# them for a submission: it has no submit path. All three: the owner's standing approval (amendment A3).
tier1 = "https://github.com/alsiola/quantum-ai/issues/28#issuecomment-6782262170"
tier2 = "https://github.com/alsiola/quantum-ai/issues/28#issuecomment-6782262170"
tier3 = "https://github.com/alsiola/quantum-ai/issues/28#issuecomment-6782262170"

[allowance]
# The owner's dashboard reading on #28, 2026-11-10 (issuecomment-6782246125): used 1.03 RU,
# remaining 8.97 RU of the Open plan's 10 RU = 10 min per rolling 28 days, so 1 RU = 60 s and
# 8.97 RU = 538.2 s, rounded down. (#33's estimate was 531 s.)
remaining_s = 538
reading_date = "2026-11-10"
scenarios_s = [600, 531, 400, 300, 200]
reserve_s = 60                                  # held back from every tier (overruns, a re-pilot)
prior_counted_s = 25.2                          # Phase 8 jobs counted: Tier 1 P&M (#37) 15.16 s + MDI (#38) 9.97 s (each max of charged and upper bound), rounded up
allowed_plans = ["open"]

[ibm]                                           # the live path only (#37)
env_file = ".env"                               # IBM_API_KEY, IBM_INSTANCE_CRN; read from this file only
channel = "ibm_cloud"
backend = "ibm_kingston"
live_summary_dir = "results/summaries/phase8_hw"

[sampler]                                       # as Phase 6/7: no error mitigation, classified bits
dynamical_decoupling = false
twirling_gates = false
twirling_measure = false

[cost]                                          # qmem.followup.CostModel (Phase 6/7)
overhead_s = 2.0
rep_delay_s = 250e-6
margin = 0.25
billing_round_s = 1.0

[tier1]                                         # Stage 3 (#33): Claim 4
hard_cap_s = 30.0
max_job_estimate_s = 20.0                       # Phase 6's per-job guard
alpha = 0.05                                    # family-wise over the two co-primaries (Holm)
secondary_alpha = 0.05
spam_gate = 0.90
min_branch_shots = 500
mdi = true                                      # optional sub-tier, only after P&M passes
power_target = 0.8
mdi_alpha = 0.05                                # MDI payoff > 0, one-sided; its own family of one (A4)

[tier1.live]                                    # #37: what the live path submits for Tier 1
# P&M only: one job of 60 circuits, 36,000 shots, in #33's seeded pub order
# (phase8_reference/summary.json plan.pm_primary). Run on #37 (results/summaries/phase8_hw/tier1/).
# MDI is the sub-tier tier1_mdi, [tier1.mdi_live] below (#38, amendment A4).
stages = ["pm_primary"]
hard_cap_s = 20.0                               # #28's request for this job (the tier's 30 s held MDI too)
qubits = [59, 75]                               # nothing else may appear in a submitted circuit
qasm_dir = "results/summaries/phase8_reference/qasm"
circuit_prefix = "pm_"
# SHA-256 of the sorted "name sha256" lines (newline-terminated) of the 60 pm_* rows of
# results/summaries/phase8_prereg/hashes.csv (#28, issuecomment-6778775029)
qasm_digest = "4d17a4507e5a682f67f2ab173e1b27d53c7bdaacbd64efc80cdec76280365276"
# Selections (section 5) that gate this tier. P&M and MDI use no re-selected qubit (the Bell
# reference applies to the Bell route only), so none; every selection is still re-run and recorded.
gating_selections = []

# The pre-registration as it governs this tier: each section's hash at its commit on main
# (qmem.followup.amendment_section/amendment_hash; the commit must be on origin/main).
[[tier1.live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 2. Tier 1: Stage 3 (#33), Claim 4"
sha256 = "00a8ab2f2592d8f20e0b6cfcee0bbd744c103fffa8bf6080cc4b5aea6acbaa35"
commit = "a161c1119271410dd8eae54523e51947d5fedc17"
[[tier1.live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 10. Amendment log"
sha256 = "d0d9ca1ad04fd5dce069a794fc98493a5bf6be7be7aff056997c4f21e20be19e"
commit = "a161c1119271410dd8eae54523e51947d5fedc17"
amendments = ["**A2, 2026-11-10, pre-data (Tier 1).**", "**A3, 2026-11-10, pre-data (approvals, budget).**"]

[tier1.mdi_live]                                # #38: Tier 1's MDI sub-tier, `--tier tier1_mdi`
# Amendment A4 (docs/phase8-preregistration.md section 10): the MDI game with `reset q74`
# immediately before psi_y. One job of 32 circuits, 20,000 shots (16 input pairs x 250 at n = 0,
# x 1,000 at n = 1), in #33's seeded pub order (phase8_reference/summary.json plan.mdi_game).
# It runs on [approval] tier1 and counts against [tier1] hard_cap_s = 30 s cumulatively with
# P&M's committed ledger (15.16 s counted), so its own cap is 30 - 15.16 = 14.84 s.
stages = ["mdi_game"]
qubits = [59, 74, 75]                           # nothing else may appear in a submitted circuit
qasm_dir = "results/summaries/phase8_reference/qasm"
circuit_prefix = "mdi_"
# SHA-256 of the sorted "name sha256" lines (newline-terminated) of the 32 mdi_* rows of
# results/summaries/phase8_prereg/hashes.csv, with the reset (A4); #33's, without it, was 33c43250...
qasm_digest = "c36a119e950020da52e8635c9d5998ce06a1d980eeda3afffed1d07467102c0b"
gating_selections = []                          # MDI uses no re-selected qubit; q74's calibration is recorded
prior_ledgers = ["results/summaries/phase8_hw/tier1/ledger.json"]   # P&M (#37)
precondition = "results/summaries/phase8_hw/tier1/decision.json"   # section 2.7: P&M passed, rejected EB
power_gate = true                               # A4: refuse unless the fitted model's power >= 0.80 at this snapshot
# The pre-registration as it governs the MDI sub-tier: section 2 (unchanged since #36/A3) and
# section 10 with A4, each hashed at its commit on main (--submit and --dry-run refuse otherwise).
[[tier1.mdi_live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 2. Tier 1: Stage 3 (#33), Claim 4"
sha256 = "00a8ab2f2592d8f20e0b6cfcee0bbd744c103fffa8bf6080cc4b5aea6acbaa35"
commit = "a161c1119271410dd8eae54523e51947d5fedc17"
[[tier1.mdi_live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 10. Amendment log"
sha256 = "e4b8269c9dcb1b10ab3d39fec221f0c69d9f64e6589e899b1dce6acbd1fe2301"
commit = "17d213ef521d26bbf4227a87b3937990cc57c186"   # A4 on main (#38)
amendments = ["**A4, 2026-11-11, pre-data for MDI (Tier 1; after P&M's data).**"]

[tier2]                                         # Stage 2 (#32, #34): Claim 3
pilot_cap_s = 30.0
main_cap_s = 150.0
controls_cap_s = 45.0
hard_cap_s = 225.0
max_job_estimate_s = 20.0                       # the campaign's per-job guard (Phase 6, Tiers 1 and 3)
# Amendment A1 (pre-data, docs/phase8-preregistration.md section 7): the designed main jobs
# (44 s each) and controls job (29 s) exceed the per-job guard. Each main time block runs as
# 3 consecutive sub-jobs and the controls tier as 2; the analysis's job = the time block.
main_subjobs_per_block = 3
controls_subjobs = 2

[tier2.live]                                    # #39: what the live path submits for Tier 2
# Amendment A5 (docs/phase8-preregistration.md section 10): the PILOT ONLY, one job of 9 arms x
# 2,000 shots in the harness's seeded pub order (tier2_schedules, [tier2.dry_run] seed), cap 30 s.
# Main (18 arms, cap 150 s) and the controls (cap 45 s) are not live stages here: they wait for
# #35's verdict on the 1 rad slot and the coordinator's review of the pilot.
stages = ["pilot"]
hard_cap_s = 30.0                               # the pilot's cap ([tier2] pilot_cap_s)
ancillas = [13, 50]                             # section 5 on ibm_kingston's 2026-11-11 02:51 UTC snapshot (A5)
qubits = [13, 50, 59, 75]                       # nothing else may appear in a submitted circuit
qasm_dir = "results/summaries/phase8_hw/tier2/qasm"   # A5's re-exports of RS, R2, R4 on [13, 50]
# A5's SHA-256 of the re-exported feed-forward arms (#32's, on [50, 21], are in plan.json)
ancilla_sha256 = { RS = "a2cab1886210987c3bd35d76a456250666ebdddb8a018f2e675868bd0b6b7439", R2 = "82ae2743f1ebdd807d049ee3f130213b77ede1660c852f2e5ae472733de05d00", R4 = "195aa5b7960d10ed38003d387ba34fc4217bb2353d117293d0915a61e1afdd17" }
# SHA-256 of the sorted "name sha256" lines (newline-terminated) of the pilot's 9 circuits:
# the 7 committed arms' plan.json hashes and A5's RS and R2
qasm_digest = "6a3fea5abb301fd872dcfb6e5fd425e4599d10512869e13d5dbc8a97c2180cef"
gating_selections = []                          # the ancillas are gated by A5's own check (phase8_live.tier2_selection_check)
# Tier 1's committed ledgers: admission counts them (already in [allowance] prior_counted_s)
earlier_ledgers = ["results/summaries/phase8_hw/tier1/ledger.json", "results/summaries/phase8_hw/tier1_mdi/ledger.json"]
# The pre-registration as it governs Tier 2's pilot: section 3 (unchanged since #36) and
# section 10 with A1 and A5, each hashed at its commit on main.
[[tier2.live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 3. Tier 2: Stage 2 (#32, #34), Claim 3"
sha256 = "9dd639485f4e5513ec78482179f56595fd0666a64578974a03760810e8453ad7"
commit = "a161c1119271410dd8eae54523e51947d5fedc17"   # unchanged since #36/A3
[[tier2.live.prereg]]
doc = "docs/phase8-preregistration.md"
heading = "## 10. Amendment log"
sha256 = "83208471f7164d48d16f545386860e92dc8d37020668cf8365f7890815db88b0"
commit = "02967c8af27f477a698a7396188d3608be87298b"   # A5 on main (#39)
amendments = ["**A1, 2026-11-10, pre-data (Tier 2).**", "**A5, 2026-11-11, pre-data for Tier 2 (after Tier 1's data).**"]

[tier2.slot_1rad]                               # #35's 1 rad extension: NOT folded in
status = "pending #35 (open when this was written); the coordinator folds it in if #35 recommends it"
arms = 6
added_main_upper_s = 34.0                       # #34 section 3.2 (contrast.json "separation")
included = false

[tier2.dry_run]
seed = 3601
n_boot = 200                                    # block bootstrap of the deficit (1000 in the real analysis)
primary_per_job = 4000                          # shots per arm per job for the likelihood contrast (the main tier: all of them)
em_iters = 300                                  # EM steps per start here (1500 in the real analysis)
refit_evals = 200                               # quantum refit's Nelder-Mead evaluations here
stat_boot = 200                                 # bootstrap resamples for the per-arm statistics here
starts = { "4" = "klein", "6" = "octahedron" }  # one start per d here (four in the real analysis)

[tier3]                                         # Stage 1 (#31): Claims 1-2 generality
hard_cap_s = 120.0
max_job_estimate_s = 12.0                       # #31's own per-job limit
option = "two_parallel"                         # #31 section 4's recommended option, full arms
deferrable = true

[tier3.dry_run]
seed = 3602
n_boot = 200

[reselection]
# Pre-stated floors: if a live snapshot selects other qubits, the stage's QASM is re-exported and
# re-hashed and its power re-checked against these; the tier aborts if a floor fails.
tier1_bell_power_floor = 0.80                   # Bell route only (not in Tier 1's plan): deficit-matched model, 6,000 shots
tier2_vanish_power_floor = 0.80                 # R2 and R4 vanish against RS, f = 0.25 (#34 section 4.1)
tier2_preserve_power_floor = 0.80               # RS non-inferior to E00, m = 0.20
tier2_ancilla_readout_max = 0.02                # conservative bias bound |P(b=1) - 1/2| <= readout error
tier3_power_floor = 0.80                        # #31's power_min, P(H1 and H2) per pair
n_mc = 20000
seed = 3603

[tier1_power]                                   # task 3: Tier 1 power under Stage 2's fitted model
draws = 4000
seed = 3604
